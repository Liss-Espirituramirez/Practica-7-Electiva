
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>
</head>
<body>
    <h1>¡Hola mundo!</h1>
    <p>Aplicación web con JavaScript y MySQL.</p>

    <button id="comprobar">Comprobar conexión</button>
    <p id="resultado">Pulsa el botón para verificar MySQL.</p>

    <script>
      
document.getElementById("comprobar").addEventListener("click", async () => {
    const resultado = document.getElementById("resultado");

    try {
        const respuesta = await fetch("/api");
        const texto = await respuesta.text();

        console.log("Respuesta del servidor:", texto);

        if (!respuesta.ok) {
            throw new Error(`Error HTTP: ${respuesta.status}`);
        }

        const datos = JSON.parse(texto);

        resultado.textContent =
            `${datos.mensaje}: ${datos.conexion}. Base de datos: ${datos.baseDatos}`;
    } catch (error) {
        resultado.textContent = `Error: ${error.message}`;
        console.error("Error al comprobar la conexión:", error);
    }
});

    </script>
</body>
</html>
