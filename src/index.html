
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>
</head>
<body>
    <h1>¡Hola mundo!</h1>
    <p>Aplicación web con JavaScript y MySQL.</p>

    <button id="comprobar">Comprobar conexión</button>
    <p id="resultado">Pulsa el botón para verificar MySQL.</p>

    <script>
        document.getElementById("comprobar").addEventListener("click", async () => {
            const resultado = document.getElementById("resultado");
            resultado.textContent = "Conectando...";

            try {
                const respuesta = await fetch("/api");
                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(datos.error || datos.mensaje);
                }

                resultado.textContent =
                    `${datos.conexion}. Base de datos: ${datos.baseDatos}`;
            } catch (error) {
                resultado.textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
