
services:
  web:
    image: node:22-alpine
    container_name: hola_mundo_web
    working_dir: /app
    volumes:
      - ./src:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: estudiante
      DB_PASSWORD: "123456"
      DB_NAME: practica
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: hola_mundo_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: practica
      MYSQL_USER: estudiante
      MYSQL_PASSWORD: "123456"
    ports:
      - "3307:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  datos_mysql:
